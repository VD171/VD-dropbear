# ======================================================================
#
#  The SSH binaries are COMMITTED (module/bin/<abi>/, see module/bin/PROVENANCE.json),
#  not built here: this keeps the release reproducible from the repo and lets the VDLU
#  feed manifest hash the exact shipped bytes while the signing key stays off CI. To pick
#  up a newer upstream Dropbear, rebuild locally (scripts/build.sh + build-bundles.sh).
#
#  RELEASE MODEL (fleet-standard, like VD-Backup / COPG-VD): the release is triggered with
#  `gh workflow run release.yml` and the CI creates BOTH the tag and the GitHub release
#  directly as github-actions[bot] (via github.token) - never a human tag push, never a
#  draft + manual UI "Publish" (STANDARDS §7.1; that would attribute the release to a human).
#  dropbear does NOT bump in CI: the VDLU baseline (module/vdlu/baseline.json) is re-packed
#  AND signed with a key kept OFF CI, so the bump + repack + sign is a LOCAL ritual
#  (scripts/repack-baseline.sh) committed before dispatch; the CI reads the already-committed
#  version from module.prop and packages the already-signed tree as-is.

name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Extra release notes (optional; prepended to the generated body)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint release workflow (no draft-publish anti-pattern)
        run: sh .github/scripts/release-workflow-lint.sh .

      - name: Verify committed binaries against provenance
        run: |
          # The committed SSH tools must match module/bin/PROVENANCE.json byte for byte.
          if [ -d module/bin ]; then
            python3 -c "import json,hashlib,sys; d=json.load(open('module/bin/PROVENANCE.json')); bad=[f'module/bin/{a}/{b}' for b,m in d['binaries'].items() for a,i in m['abi'].items() if hashlib.sha256(open(f'module/bin/{a}/{b}','rb').read()).hexdigest()!=i['sha256']]; sys.exit('provenance MISMATCH: '+', '.join(bad)) if bad else print('provenance OK')"
          fi

      - name: Assemble module zip
        id: pack
        run: |
          # Ship the notices inside the flashable module (the zip is module/ only),
          # so the GPL-3.0 rsync binary travels with its license texts in module/licenses/.
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.md module/
          # Drop files excluded from the zip BEFORE hashing: otherwise gen-sha256 writes a
          # companion for a file the zip omits, and that orphan <file>.sha256 ships without its
          # target - the flash-time gate runs `sha256sum -c` on every .sha256 and aborts the flash
          # on the missing target. Remove them first so every shipped .sha256 has its file.
          rm -f module/vdlu/RELEASE.md
          find module -name .gitkeep -delete
          # Per-file .sha256 companions in the flashable payload (STANDARDS 8). Generated here,
          # after the final tree is assembled and BEFORE zipping, so each matches what ships.
          # vdlu-pack excludes *.sha256, so they ride only in the zip, never in the VDLU manifest.
          sh .github/scripts/gen-sha256.sh module
          ver="$(sed -n 's/^version=//p' module/module.prop)"
          ( cd module && zip -r -X "../VD-dropbear-${ver}.zip" . -x '*/.gitkeep' -x 'vdlu/RELEASE.md' )
          sha256sum VD-dropbear-*.zip
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        # House rules (do NOT change without the owner): the body ends with the canonical
        # @Priv8_VD banner VERBATIM, carries a per-file sha256 block, and NEVER includes a
        # "Generated with Claude" footer (that is for docs/wiki only).
        env:
          EXTRA_NOTES: ${{ github.event.inputs.notes }}
        run: |
          ver="${{ steps.pack.outputs.ver }}"
          zip="VD-dropbear-${ver}.zip"
          tmp="$(mktemp -d)"; unzip -q "$zip" -d "$tmp"
          # sha256 of the zip, then of every file inside it
          sums="$( sha256sum "$zip"; ( cd "$tmp" && find . -type f | sed 's#^\./##' | LC_ALL=C sort | while IFS= read -r f; do sha256sum "$f"; done ) )"
          rm -rf "$tmp"
          {
            echo "Standalone, fully configurable rooted SSH server for KernelSU, APatch and Magisk, with a WebUI."
            echo
            if [ -n "$EXTRA_NOTES" ]; then echo "$EXTRA_NOTES"; echo; fi
            echo "> **An authenticated login defaults to a root shell.** Prefer keys over passwords, bind only to networks you trust, and keep the port off the open Internet."
            echo
            echo "### Install"
            echo "Flash \`${zip}\` in the KernelSU / APatch / Magisk manager (or \`ksud module install\` / \`apd module install\`), open its **WebUI** to set the port and add your keys, then reboot."
            echo
            echo "### Documentation"
            echo "Full guide and reference: https://github.com/VD171/VD-dropbear/wiki"
            echo
            echo "### Checksums (sha256)"
            echo
            echo '```'
            echo "$sums"
            echo '```'
            echo
            echo "---"
            echo "📣 **Join the channel for updates:** @Priv8_VD https://t.me/Priv8_VD"
          } > RELEASE-BODY.md

      - name: Create the tag and publish the release (github-actions[bot])
        # gh release create makes BOTH the tag and the release server-side as the bot
        # (github.token): no manual tag push, no draft, no PAT. The human's release decision
        # is the `gh workflow run` dispatch; the machine tags and publishes.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ steps.pack.outputs.ver }}"
          if gh release view "$ver" >/dev/null 2>&1; then
            echo "::error::release $ver already exists; bump module.prop before dispatching"; exit 1
          fi
          gh release create "$ver" --target "$GITHUB_SHA" --title "$ver" --notes-file RELEASE-BODY.md VD-dropbear-*.zip

      - name: Assert release author is github-actions[bot]
        # Authoritative check (owner HARD rule, github_release_sempre_bot_author): verify the REAL
        # author of the just-published release is the bot, never a human. Catches any cause (draft,
        # PAT, manual), not just a YAML pattern. github.token => bot; read-only gh is never blocked.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ steps.pack.outputs.ver }}"
          author="$(gh release view "$ver" --json author -q '.author.login')"
          [ "$author" = "github-actions[bot]" ] \
            || { echo "::error::release $ver authored by $author, not github-actions[bot]"; exit 1; }
