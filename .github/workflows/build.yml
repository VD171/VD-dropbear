#  XDA-Developers : @VD171 https://xdaforums.com/m/vd171.4699873/
#  XDA thread     : https://xdaforums.com/t/VD-Dropbear.4808524/
#  Telegram       : @VD_Priv8 https://t.me/VD_Priv8
#  Channel        : @Priv8_VD https://t.me/Priv8_VD
#  Discord        : @VD.Priv8 https://discord.com/users/1296831918989639721
#  E-mail         : vd.priv8@pm.me
# ======================================================================
#
#  The SSH binaries are COMMITTED (module/bin/<abi>/, see module/bin/PROVENANCE.json),
#  not built here: this keeps the release reproducible from the repo and lets the VDLU
#  feed manifest hash the exact shipped bytes while the signing key stays off CI. To
#  pick up a newer upstream Dropbear, rebuild locally with scripts/build.sh +
#  scripts/build-bundles.sh and commit the result.

name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']   # a tag push publishes the release (see the release job)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed binaries against provenance
        run: |
          # The committed SSH tools must match module/bin/PROVENANCE.json byte for byte.
          if [ -d module/bin ]; then
            python3 -c "import json,hashlib,sys; d=json.load(open('module/bin/PROVENANCE.json')); bad=[f'module/bin/{a}/{b}' for b,m in d['binaries'].items() for a,i in m['abi'].items() if hashlib.sha256(open(f'module/bin/{a}/{b}','rb').read()).hexdigest()!=i['sha256']]; sys.exit('provenance MISMATCH: '+', '.join(bad)) if bad else print('provenance OK')"
          fi
      - name: Assemble module zip
        id: pack
        run: |
          # Ship the notices inside the flashable module (the zip is module/ only),
          # so the GPL-3.0 rsync binary travels with its license texts in module/licenses/.
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.md module/
          ver="$(sed -n 's/^version=//p' module/module.prop)"
          ( cd module && zip -r -X "../VD-dropbear-${ver}.zip" . -x '*/.gitkeep' -x 'vdlu/RELEASE.md' )
          sha256sum VD-dropbear-*.zip
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"
      # Keep the run artifact for branch builds (CI validation / quick download).
      # On a tag build the Release below is the canonical, directly-flashable zip,
      # so skip the artifact there: a GitHub artifact is wrapped in an extra zip
      # layer and is not flashable as-is, which only confuses the download.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: VD-dropbear-${{ steps.pack.outputs.ver }}
          path: VD-dropbear-*.zip
      - name: Write release notes (tags only)
        # House rules (do NOT change without the owner): the body ends with the
        # canonical @Priv8_VD banner VERBATIM, carries a per-file sha256 block, and
        # NEVER includes a "Generated with Claude" footer (that is for docs/wiki only).
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver="${{ steps.pack.outputs.ver }}"
          zip="VD-dropbear-${ver}.zip"
          tmp="$(mktemp -d)"; unzip -q "$zip" -d "$tmp"
          # sha256 of the zip, then of every file inside it
          sums="$( sha256sum "$zip"; ( cd "$tmp" && find . -type f | sed 's#^\./##' | LC_ALL=C sort | while IFS= read -r f; do sha256sum "$f"; done ) )"
          rm -rf "$tmp"
          {
            echo "Standalone, fully configurable rooted SSH server for KernelSU, APatch and Magisk, with a WebUI."
            echo
            echo "> **An authenticated login defaults to a root shell.** Prefer keys over passwords, bind only to networks you trust, and keep the port off the open Internet."
            echo
            echo "### Install"
            echo "Flash \`${zip}\` in the KernelSU / APatch / Magisk manager (or \`ksud module install\` / \`apd module install\`), open its **WebUI** to set the port and add your keys, then reboot."
            echo
            echo "### Documentation"
            echo "Full guide and reference: https://github.com/VD171/VD-dropbear/wiki"
            echo
            echo "### Checksums (sha256)"
            echo
            echo '```'
            echo "$sums"
            echo '```'
            echo
            echo "---"
            echo "📣 **Join the channel for updates:** @Priv8_VD https://t.me/Priv8_VD"
          } > RELEASE-BODY.md
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VD-dropbear-*.zip
          body_path: RELEASE-BODY.md
