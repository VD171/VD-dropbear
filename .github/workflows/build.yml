name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']   # a tag push builds AND publishes the release (see the release job)
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # daily: pick up new upstream Dropbear releases

permissions:
  contents: write

jobs:
  # Bump UPSTREAM_VERSION when upstream Dropbear tags a newer release; the push
  # it makes triggers the build job below.
  track-upstream:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check upstream for a newer tag
        run: |
          cur="$(tr -d ' \n' < UPSTREAM_VERSION)"
          latest="$(git ls-remote --tags --refs https://github.com/mkj/dropbear \
                    | sed -E 's#.*refs/tags/##' | grep -E '^DROPBEAR_[0-9]' | sort -V | tail -1)"
          echo "current=$cur latest=$latest"
          if [ -n "$latest" ] && [ "$latest" != "$cur" ]; then
            echo "$latest" > UPSTREAM_VERSION
            git config user.name "VD \$ VD171 @ Priv8"
            git config user.email "80125987+VD171@users.noreply.github.com"
            git commit -am "upstream: track $latest"
            git push
          fi

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      - name: Build the daemon (all ABIs)
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: bash scripts/build.sh
      - name: Build the bundled tools - sftp-server, scp, rsync (all ABIs)
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: bash scripts/build-bundles.sh
      - name: Assemble module zip
        id: pack
        run: |
          ver="$(sed -n 's/^version=//p' module/module.prop)"
          ( cd module && zip -r -X "../VD-dropbear-${ver}.zip" . -x '*/.gitkeep' )
          sha256sum VD-dropbear-*.zip
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: VD-dropbear-${{ steps.pack.outputs.ver }}
          path: VD-dropbear-*.zip
      - name: Write release notes (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver="${{ steps.pack.outputs.ver }}"
          cat > RELEASE-BODY.md <<EOF
          **VD Dropbear ${ver}** - a standalone, fully configurable rooted SSH server for KernelSU, APatch and Magisk, with a WebUI.

          > **Every authenticated connection receives a root shell.** Prefer keys over passwords, bind only to networks you trust, and keep the port off the open Internet.

          ### Install
          Flash \`VD-dropbear-${ver}.zip\` in the KernelSU / APatch / Magisk manager (or \`ksud module install\` / \`apd module install\`), open the module's **WebUI** to set the port and add your keys, then reboot.

          ### Documentation
          Full guide and reference: https://github.com/VD171/VD-dropbear/wiki

          ---
          📣 Join [@Priv8_VD](https://t.me/Priv8_VD)

          _Generated with Claude._
          EOF
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VD-dropbear-*.zip
          body_path: RELEASE-BODY.md
