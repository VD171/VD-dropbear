# yaml-language-server: $schema=https://raw.githubusercontent.com/KernelSU-Modules/tools/main/schemas/module.schema.json
schemaVersion: 1
id: vddropbear
name: VD Dropbear
summary: Standalone, fully configurable Dropbear SSH server for KernelSU/APatch/Magisk, with port, keys, passwords and start behaviour all set from its WebUI.
description: README.md
license: Apache-2.0
homepage: https://github.com/VD171/VD-dropbear
support: https://xdaforums.com/t/4808524
tags:
  - kernelsu
  - apatch
  - magisk
  - root
  - ssh
  - dropbear
  - sftp
  - webui
compatibility:
  architectures:
    - arm64-v8a
    - armeabi-v7a
    - x86
    - x86_64
release:
  assetPattern: "VD-dropbear-*.zip"
