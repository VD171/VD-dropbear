<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="VD Dropbear">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2430"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#e6eaf0"/>
      <stop offset="0.55" stop-color="#aeb6c2"/>
      <stop offset="0.7" stop-color="#d7dce3"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36e86a"/>
      <stop offset="1" stop-color="#17c74a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)" stroke="url(#silver)" stroke-width="6"/>

  <!-- terminal screen -->
  <rect x="44" y="60" width="168" height="124" rx="16" fill="#060a10" stroke="#2a3340" stroke-width="3"/>
  <!-- title bar dots -->
  <circle cx="62" cy="78" r="4.5" fill="#3a4350"/>
  <circle cx="78" cy="78" r="4.5" fill="#3a4350"/>
  <circle cx="94" cy="78" r="4.5" fill="#3a4350"/>

  <!-- prompt ">_" (secure shell) -->
  <g filter="url(#glow)" fill="none" stroke="url(#green)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="68,110 96,134 68,158"/>
  </g>
  <rect x="112" y="150" width="46" height="12" rx="6" fill="url(#green)" filter="url(#glow)"/>

  <!-- padlock badge: private access -->
  <g transform="translate(168,120)">
    <path d="M -14 6 v -10 a 14 14 0 0 1 28 0 v 10" fill="none" stroke="url(#silver)" stroke-width="7"/>
    <rect x="-22" y="4" width="44" height="36" rx="8" fill="url(#silver)"/>
    <circle cx="0" cy="18" r="6" fill="#0b0e14"/>
    <rect x="-3" y="18" width="6" height="12" rx="3" fill="#0b0e14"/>
  </g>
</svg>
