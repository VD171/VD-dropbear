<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="VD Dropbear">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2430"/><stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#e6eaf0"/>
      <stop offset="0.55" stop-color="#aeb6c2"/><stop offset="0.7" stop-color="#d7dce3"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36e86a"/><stop offset="1" stop-color="#17c74a"/>
    </linearGradient>
  </defs>

  <!-- full dark card (so the image always has a background, on light or dark GitHub themes) -->
  <rect x="1.5" y="1.5" width="757" height="237" rx="30" fill="url(#bg)" stroke="url(#silver)" stroke-width="2"/>

  <!-- icon: terminal prompt + padlock (the 256 mark, scaled into the card) -->
  <g transform="translate(30,27) scale(0.77)">
    <rect x="8" y="8" width="240" height="240" rx="54" fill="#0b0e14" stroke="url(#silver)" stroke-width="6"/>
    <rect x="44" y="60" width="168" height="124" rx="16" fill="#060a10" stroke="#2a3340" stroke-width="3"/>
    <circle cx="62" cy="78" r="4.5" fill="#3a4350"/><circle cx="78" cy="78" r="4.5" fill="#3a4350"/><circle cx="94" cy="78" r="4.5" fill="#3a4350"/>
    <polyline points="68,110 96,134 68,158" fill="none" stroke="url(#green)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="112" y="150" width="46" height="12" rx="6" fill="url(#green)"/>
    <g transform="translate(168,120)">
      <path d="M -14 6 v -10 a 14 14 0 0 1 28 0 v 10" fill="none" stroke="url(#silver)" stroke-width="7"/>
      <rect x="-22" y="4" width="44" height="36" rx="8" fill="url(#silver)"/>
      <circle cx="0" cy="18" r="6" fill="#0b0e14"/><rect x="-3" y="18" width="6" height="12" rx="3" fill="#0b0e14"/>
    </g>
  </g>

  <!-- wordmark + tagline (sized to stay inside the viewBox) -->
  <text x="250" y="120" font-family="'Segoe UI','DejaVu Sans',Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="-1">
    <tspan fill="url(#green)">VD</tspan><tspan fill="url(#silver)"> Dropbear</tspan>
  </text>
  <text x="253" y="162" font-family="'Segoe UI','DejaVu Sans',Arial,sans-serif" font-size="23" font-weight="500" fill="#9aa4b2">
    private rooted SSH - no ADB exposure
  </text>
</svg>
